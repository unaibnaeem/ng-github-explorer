<div
  [class.dark]="isDark()"
  class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100"
>
  <header
    class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur-md dark:border-slate-800 dark:bg-slate-900/90"
  >
    <div
      class="mx-auto flex w-full max-w-6xl flex-col gap-4 px-4 py-4 sm:flex-row sm:items-center sm:justify-between"
    >
      <a
        routerLink="/"
        class="shrink-0 text-xl font-bold tracking-tight text-slate-900 dark:text-white"
      >
        GitHub
        <span class="text-brand-600 dark:text-brand-400">Explorer</span>
      </a>

      <div class="flex w-full items-center gap-2 sm:max-w-sm">
        <div class="min-w-0 flex-1">
          <app-search-bar (searched)="onSearch($event)" />
        </div>

        <button
          type="button"
          (click)="toggleTheme()"
          [attr.aria-label]="
            isDark() ? 'Switch to light mode' : 'Switch to dark mode'
          "
          [attr.aria-pressed]="isDark()"
          class="hover:border-brand-500 flex h-12 shrink-0 cursor-pointer items-center justify-center rounded-xl border border-slate-200 bg-white px-4 text-sm font-medium text-slate-700 transition dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200"
        >
          {{ isDark() ? '☀' : '☾' }}
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-6xl px-4 py-8 sm:py-12">
    <router-outlet />
  </main>
</div>
