<section class="flex min-h-[65vh] items-center justify-center py-12">
  <div class="w-full max-w-3xl text-center">
    <span
      class="border-brand-100 bg-brand-50 text-brand-700 dark:border-brand-900 dark:bg-brand-950 dark:text-brand-300 inline-flex rounded-full border px-3 py-1 text-xs font-medium tracking-wide"
    >
      GITHUB PROFILE EXPLORER
    </span>

    <h1
      class="mt-6 text-4xl font-semibold tracking-tight text-slate-900 sm:text-5xl dark:text-white"
    >
      Explore GitHub profiles.
    </h1>

    <p
      class="mx-auto mt-4 max-w-xl text-base leading-7 text-slate-500 dark:text-slate-400"
    >
      Discover developers, explore their public repositories, and find
      interesting projects on GitHub.
    </p>

    <div class="mx-auto mt-8 max-w-2xl">
      <app-search-bar (searched)="search($event)" />
    </div>

    <div class="mt-8 flex flex-wrap items-center justify-center gap-3 text-sm">
      <span class="text-slate-500 dark:text-slate-400"> Try an example: </span>

      @for (username of examples; track username) {
      <button
        type="button"
        (click)="search(username)"
        class="hover:border-brand-300 hover:text-brand-700 dark:hover:border-brand-500 dark:hover:text-brand-400 cursor-pointer rounded-full border border-slate-200 bg-white px-4 py-2 font-medium text-slate-600 transition dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300"
      >
        @{{ username }}
      </button>
      }
    </div>
  </div>
</section>
